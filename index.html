<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICE Security - Control Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #050811;
      --card-bg: rgba(10, 16, 30, 0.85);
      --card-border: rgba(0, 229, 255, 0.15);
      --primary: #00e5ff;
      --primary-glow: rgba(0, 229, 255, 0.35);
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --text: #e2e8f0;
      --text-muted: #64748b;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.04), transparent 25%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #0066cc);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #000;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .brand-title h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #fff;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 230, 118, 0.1);
      border: 1px solid rgba(0, 230, 118, 0.3);
      font-size: 0.85rem;
      color: var(--success);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-header h3 {
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .card p.desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* Inputs & Buttons */
    .input-field {
      width: 100%;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: 0.2s border;
      margin-bottom: 12px;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, #0099cc, var(--primary));
      border: none;
      color: #000;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn:hover {
      box-shadow: 0 0 15px var(--primary-glow);
      transform: translateY(-1px);
    }

    /* Avatar Presence List */
    .radar-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
    }

    .radar-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .btn-kick {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid rgba(255, 0, 85, 0.3);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-kick:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Cyber Security PIN Modal */
    .cyber-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .cyber-pin-card {
      width: 90%;
      max-width: 380px;
      background: linear-gradient(135deg, rgba(14, 22, 38, 0.95), rgba(7, 12, 22, 0.98));
      border: 1px solid rgba(0, 229, 255, 0.3);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.15);
      border-radius: 12px;
      padding: 30px 24px;
      text-align: center;
      position: relative;
    }

    .cyber-shield-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    .cyber-pin-card h3 {
      color: #fff;
      font-size: 1.2rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .cyber-pin-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    #modalPinInput {
      width: 100%;
      background: rgba(2, 6, 14, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 8px;
      padding: 14px 0;
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 12px;
      color: var(--primary);
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 14px;
    }

    #modalPinInput:focus {
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .pin-error {
      color: #ff3b5c;
      font-size: 0.8rem;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!-- Inzu y'Umutekano / PIN Security Modal -->
  <div id="pinModalOverlay" class="cyber-modal-overlay" style="display: none;">
    <div class="cyber-pin-card">
      <div class="cyber-shield-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <h3>SECURITY ACCESS</h3>
      <p>Injiza kode ya PIN kugira ngo ufungure porogaramu</p>

      <input type="password" id="modalPinInput" maxlength="8" placeholder="••••" autocomplete="off" />
      <div id="pinErrorMsg" class="pin-error" style="display: none;"></div>
      
      <button class="btn" onclick="submitModalPin()">KUNZURA SISITEMU</button>
    </div>
  </div>

  <!-- Umubiri w'Urubuga / Main Studio Container -->
  <div class="container" id="mainStudio" style="display: none;">
    <header>
      <div class="brand">
        <div class="brand-logo">ICE</div>
        <div class="brand-title">
          <h1>ICE SECURITY</h1>
          <p id="subRegionInfo">Autonomous Parcel Defense</p>
        </div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="gatewayStatus">CORE CONNECTED</span>
      </div>
    </header>

    <div class="grid">
      <!-- Ikarita y'Umutekano wa PIN -->
      <div class="card">
        <div class="card-header">
          <h3>REMOTE ACCESS PIN</h3>
        </div>
        <p class="desc">Shyiraho PIN (imibare 4-8) yo gukoresha ku yindi mashini cyangwa telefoni.</p>
        <input type="password" id="newPinInput" class="input-field" placeholder="Shyiramo PIN nshya" maxlength="8" />
        <button class="btn" onclick="saveNewPinFromUI()">BIKA PIN</button>
      </div>

      <!-- Ikarita ya Radar / Abalimo -->
      <div class="card">
        <div class="card-header">
          <h3>LIVE RADAR</h3>
        </div>
        <p class="desc">Abari mu kibanza muri aka kanya:</p>
        <ul id="avatarList" class="radar-list">
          <li class="radar-item">Nta muntu uraboneka...</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://ice-security-backend.onrender.com";

    const urlParams = new URLSearchParams(window.location.search);
    let ownerId = urlParams.get('id') || localStorage.getItem('ice_owner_id');
    let storedPin = localStorage.getItem('ice_pin_' + ownerId) || '';

    function showPinModal(err = "") {
      const modal = document.getElementById('pinModalOverlay');
      const errEl = document.getElementById('pinErrorMsg');
      const inputEl = document.getElementById('modalPinInput');

      if (err) {
        errEl.innerText = err;
        errEl.style.display = "block";
      } else {
        errEl.style.display = "none";
      }

      modal.style.display = "flex";
      inputEl.value = "";
      inputEl.focus();
    }

    function hidePinModal() {
      document.getElementById('pinModalOverlay').style.display = "none";
      document.getElementById('mainStudio').style.display = "block";
    }

    async function fetchStudioData() {
      if (!ownerId) {
        alert("Shyiramo UUID muri URL (?id=UUID)");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/settings?id=${ownerId}&pin=${encodeURIComponent(storedPin)}`);
        
        if (res.status === 401) {
          showPinModal();
          return;
        }

        const data = await res.json();
        if (data.status === "success") {
          localStorage.setItem('ice_owner_id', ownerId);
          if (storedPin) localStorage.setItem('ice_pin_' + ownerId, storedPin);

          hidePinModal();
          renderUI(data);
        }
      } catch (e) {
        console.error("Connection error:", e);
      }
    }

    function renderUI(data) {
      document.getElementById('subRegionInfo').innerText = `${data.parcelName || 'Parcel'} (${data.region || 'Region'})`;
      
      const listEl = document.getElementById('avatarList');
      listEl.innerHTML = "";

      if (!data.onlineAvatars || data.onlineAvatars.length === 0) {
        listEl.innerHTML = "<li class='radar-item'>Nta wundi muntu urimo.</li>";
        return;
      }

      data.onlineAvatars.forEach(name => {
        const li = document.createElement('li');
        li.className = 'radar-item';
        li.innerHTML = `
          <span>${name}</span>
          <button class="btn-kick" onclick="kickAvatar('${name}')">EJECT</button>
        `;
        listEl.appendChild(li);
      });
    }

    async function submitModalPin() {
      const pinVal = document.getElementById('modalPinInput').value.trim();
      if (pinVal.length < 4) {
        showPinModal("PIN igomba kuba byibuze imibare 4.");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/verify-pin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ownerId: ownerId, pin: pinVal })
        });

        const data = await res.json();
        if (res.ok && data.status === "success") {
          storedPin = pinVal;
          localStorage.setItem('ice_pin_' + ownerId, pinVal);
          hidePinModal();
          fetchStudioData();
        } else {
          showPinModal("PIN ntabwo ariyo! Wongeye kugerageza.");
        }
      } catch (e) {
        showPinModal("Ikosa ry'itumanaho ryabaye.");
      }
    }

    async function saveNewPinFromUI() {
      const newPin = document.getElementById('newPinInput').value.trim();
      if (newPin.length < 4 || newPin.length > 8) {
        alert("PIN igomba kuba iri hagati y'imibare 4 na 8.");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/set-pin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ownerId: ownerId, pin: newPin })
        });

        const data = await res.json();
        if (res.ok) {
          storedPin = newPin;
          localStorage.setItem('ice_pin_' + ownerId, newPin);
          document.getElementById('newPinInput').value = "";
          alert("PIN yawe nshya yabitswe neza!");
        } else {
          alert(data.error || "Ntibyashobotse kubika PIN.");
        }
      } catch (e) {
        alert("Ikosa rya seriveri ryabaye.");
      }
    }

    async function kickAvatar(name) {
      if (!confirm(`${name} kumwirukana mu kibanza urabyizeye?`)) return;
      try {
        await fetch(`${BACKEND_URL}/api/manual-action`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ownerId: ownerId, targetName: name })
        });
        alert(`Itegeko ryo kwirukana ${name} ryoherejwe!`);
      } catch (e) {
        alert("Ntibyashobotse kohereza itegeko.");
      }
    }

    document.getElementById('modalPinInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') submitModalPin();
    });

    window.addEventListener('DOMContentLoaded', () => {
      fetchStudioData();
      setInterval(fetchStudioData, 5000);
    });
  </script>
</body>
</html>
