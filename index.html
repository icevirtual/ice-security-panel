<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Security - Web Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-base: #08090c;
            --card-bg: rgba(16, 20, 29, 0.75);
            --border: #1f2937;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.35);
            --danger: #ff0055;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #10b981;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-live.offline {
            color: var(--danger);
            background: rgba(255, 0, 85, 0.1);
            border-color: rgba(255, 0, 85, 0.3);
        }

        .grid-layout {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        #radar-container {
            width: 100%;
            height: 480px;
            border-radius: 8px;
            overflow: hidden;
            background: radial-gradient(circle, #0e1726 0%, #05070a 100%);
            border: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            color: var(--accent);
        }

        button.btn-danger {
            border-color: rgba(255, 0, 85, 0.4);
        }

        button.btn-danger:hover {
            border-color: var(--danger);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
            color: var(--danger);
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        .meta-val {
            color: var(--text-main);
            font-weight: 700;
        }

        #log-area {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 0.75rem;
            color: var(--accent);
            pointer-events: none;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">ICE // SECURITY OS</div>
        <div id="orb-status-badge" class="badge-live offline">CONNECTING...</div>
    </div>

    <div class="grid-layout">
        <!-- SOL PANEL: 3D THREE.JS RADAR -->
        <div class="panel-card">
            <div class="section-title">
                <span>3D PARCEL RADAR</span>
                <span id="detected-count">0 AVATARS</span>
            </div>
            <div id="radar-container">
                <div id="log-area">SYSTEM IDLE</div>
            </div>
        </div>

        <!-- SAĞ PANEL: KONTROLLER -->
        <div class="panel-card control-group">
            <div class="meta-info">
                <span>REGION:</span>
                <span id="reg-name" class="meta-val">--</span>
            </div>
            <div class="meta-info">
                <span>PARCEL:</span>
                <span id="parcel-name" class="meta-val">--</span>
            </div>

            <div class="section-title">DEFENSE DIRECTIVES</div>
            <div class="btn-grid">
                <button onclick="sendCommand('lockdown')">LOCKDOWN</button>
                <button onclick="sendCommand('tracker_only')">TRACKER ONLY</button>
            </div>
            <button class="btn-danger" onclick="sendCommand('disarm')">DISARM SYSTEM</button>

            <div class="section-title" style="margin-top: 15px;">DISCORD INTEGRATION</div>
            <input type="text" id="discord-webhook-input" placeholder="https://discord.com/api/webhooks/...">
            <div class="btn-grid">
                <button onclick="saveWebhook()">SAVE WEBHOOK</button>
                <button onclick="testDiscord()">TEST ALERT</button>
            </div>

            <div class="section-title" style="margin-top: 15px;">WHITELIST MANAGEMENT</div>
            <input type="text" id="whitelist-input" placeholder="ResidentName, AnotherResident">
            <button onclick="saveWhitelist()">SYNC WHITELIST</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://ice-security-backend.onrender.com";
        const urlParams = new URLSearchParams(window.location.search);
        const ownerKey = urlParams.get('id') || "default-owner";

        // Three.js Radar Hazırlığı
        let scene, camera, renderer, pointsGroup;
        const container = document.getElementById('radar-container');

        function init3DRadar() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 180, 220);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Zemin Izgarası
            const gridHelper = new THREE.GridHelper(256, 16, 0x00f0ff, 0x1f2937);
            scene.add(gridHelper);

            pointsGroup = new THREE.Group();
            scene.add(pointsGroup);

            function animate() {
                requestAnimationFrame(animate);
                pointsGroup.rotation.y += 0.002;
                renderer.render(scene, camera);
            }
            animate();
        }

        init3DRadar();

        // Telemetri Döngüsü
        async function fetchTelemetry() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/status/${ownerKey}`);
                const data = await res.json();

                const badge = document.getElementById('orb-status-badge');
                if (data.online) {
                    badge.className = "badge-live";
                    badge.innerText = "ORB ONLINE";
                } else {
                    badge.className = "badge-live offline";
                    badge.innerText = "ORB OFFLINE";
                }

                document.getElementById('reg-name').innerText = data.region || "--";
                document.getElementById('parcel-name').innerText = data.parcelName || "--";
                
                updateRadarDots(data.avatars || []);
            } catch (err) {
                console.error("Telemetry fetch failed:", err);
            }
        }

        function updateRadarDots(avatars) {
            // Mevcut noktaları temizle
            while(pointsGroup.children.length > 0) {
                pointsGroup.remove(pointsGroup.children[0]);
            }

            document.getElementById('detected-count').innerText = `${avatars.length} AVATARS`;

            avatars.forEach(av => {
                // Merkezileştirilmiş X-Y-Z koordinat eşleme
                const posX = (av.x - 128);
                const posZ = (av.y - 128);
                const posY = (av.z / 10);

                const geo = new THREE.SphereGeometry(3, 16, 16);
                const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(posX, posY, posZ);
                pointsGroup.add(mesh);
            });
        }

        // Komut Gönderimi
        async function sendCommand(cmd) {
            logStatus(`Executing direct directive: ${cmd.toUpperCase()}`);
            try {
                await fetch(`${BACKEND_URL}/api/settings/${ownerKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                logStatus(`Command ${cmd} dispatched successfully`);
            } catch (e) {
                logStatus(`Error dispatching ${cmd}`);
            }
        }

        // Webhook Testi
        async function testDiscord() {
            const hook = document.getElementById('discord-webhook-input').value;
            if (!hook) {
                alert("Please enter a Discord Webhook URL first.");
                return;
            }
            logStatus("Dispatching Discord test probe...");
            try {
                const res = await fetch(`${BACKEND_URL}/api/test-discord`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ webhookUrl: hook })
                });
                const r = await res.json();
                alert(r.message || "Alert Sent!");
                logStatus("Discord test confirmed.");
            } catch(e) {
                alert("Failed to send test alert.");
                logStatus("Discord test failed.");
            }
        }

        function saveWebhook() {
            const hook = document.getElementById('discord-webhook-input').value;
            localStorage.setItem('ice_saved_hook', hook);
            fetch(`${BACKEND_URL}/api/settings/${ownerKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ discordWebhook: hook })
            });
            alert("Webhook successfully saved & synced.");
        }

        function saveWhitelist() {
            const listStr = document.getElementById('whitelist-input').value;
            const arr = listStr.split(',').map(s => s.trim()).filter(Boolean);
            fetch(`${BACKEND_URL}/api/settings/${ownerKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ whitelist: arr })
            });
            alert("Whitelist synced to cloud.");
        }

        function logStatus(text) {
            document.getElementById('log-area').innerText = text;
        }

        // Kayıtlı webhook varsa getir
        const saved = localStorage.getItem('ice_saved_hook');
        if (saved) document.getElementById('discord-webhook-input').value = saved;

        // 2 saniyede bir paneli otomatik senkronize et
        setInterval(fetchTelemetry, 2000);
        fetchTelemetry();
    </script>
</body>
</html>
